name: Release

# Vydanie sa spúšťa tagom: `git tag v1.0.1 && git push origin v1.0.1`.
#
# Workflow najprv overí, že verzia v tagu sedí so všetkými tromi miestami, kde
# je v kóde zapísaná. Nesúlad medzi hlavičkou pluginu a `Stable tag` v readme.txt
# je klasická tichá chyba — WordPress by ponúkol aktualizáciu, ktorá by sa
# tvárila ako iná verzia. Radšej nech to padne tu.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Zisti verziu z tagu
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Over, že verzie sedia
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          fail=0

          header=$(sed -n 's/^ \* Version:[[:space:]]*\(.*\)$/\1/p' denar-for-woocommerce.php | head -1 | tr -d '[:space:]')
          constant=$(sed -n "s/^define( 'DENAR_WC_VERSION', '\(.*\)' );$/\1/p" denar-for-woocommerce.php | head -1)
          stable=$(sed -n 's/^Stable tag:[[:space:]]*\(.*\)$/\1/p' readme.txt | head -1 | tr -d '[:space:]')

          for pair in "hlavička pluginu:$header" "DENAR_WC_VERSION:$constant" "readme.txt Stable tag:$stable"; do
            name=${pair%%:*}
            value=${pair#*:}
            if [ "$value" != "$VERSION" ]; then
              echo "::error::$name = '$value', ale tag je '$VERSION'"
              fail=1
            fi
          done

          if ! grep -q "^= ${VERSION} =$" readme.txt; then
            echo "::error::readme.txt nemá changelog sekciu '= ${VERSION} ='"
            fail=1
          fi

          exit $fail

      - name: Zostav zipy (GitHub a wordpress.org)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bin/build.sh github "$VERSION"
          bin/build.sh wporg "$VERSION"

      - name: Vytiahni changelog pre tento release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Text medzi '= X.Y.Z =' a ďalším '= ' nadpisom (alebo koncom súboru).
          awk -v v="= ${VERSION} =" '
            $0 == v { found = 1; next }
            found && /^= .* =$/ { exit }
            found { print }
          ' readme.txt > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "Vydanie ${VERSION}." > release-notes.md
          fi

      - name: Publikuj release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/denar-for-woocommerce-${VERSION}.zip" \
            "build/denar-for-woocommerce-wporg-${VERSION}.zip" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md

      # Nasadenie do SVN wordpress.org. Zapne sa až po schválení pluginu:
      # repo premenná WPORG_DEPLOY=true a secrets SVN_USERNAME / SVN_PASSWORD
      # (heslo SVN z profilu na wordpress.org, nie heslo účtu).
      - name: Nasaď na wordpress.org
        if: vars.WPORG_DEPLOY == 'true'
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: denar-for-woocommerce
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_DIR: build/wporg/denar-for-woocommerce
          ASSETS_DIR: .wordpress-org
