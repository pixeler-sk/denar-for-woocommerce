<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<title>Denár pre WooCommerce - banner</title>
<link rel="stylesheet" href="base.css">
<style>
    /* Designed at 772x250, rendered at 1x and 2x (1544x500). */
    .bar { position: absolute; top: 0; left: 0; width: 140px; height: 5px; background: var(--sky); }

    .copy { position: absolute; top: 30px; left: 40px; width: 350px; }
    /* Bottom-left ~90 px stays empty: WordPress overlays the plugin name there. */
    .head { display: flex; align-items: baseline; gap: 12px; }
    .head .logo { font-size: 20px; }
    .eyebrow { color: var(--sky); font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; }
    h1 { margin-top: 14px; font-size: 30px; font-weight: 600; line-height: 1.12; letter-spacing: -0.015em; }
    .sub { margin-top: 11px; color: var(--text-on-dark); font-size: 13px; line-height: 1.45; }


    /* Order -> proforma -> invoice, the flow the plugin automates. */
    .flow { position: absolute; top: 30px; right: 72px; width: 290px; display: flex; flex-direction: column; gap: 9px; }
    .step {
        display: flex; align-items: center; gap: 11px; padding: 10px 12px;
        border: 1px solid rgba(255, 255, 255, 0.09); border-radius: 11px;
        background: rgba(255, 255, 255, 0.055);
        box-shadow: 0 14px 30px -18px rgba(0, 0, 0, 0.6);
    }
    .step:nth-child(2) { transform: translateX(15px); }
    .step:nth-child(3) { transform: translateX(30px); background: rgba(255, 255, 255, 0.085); border-color: rgba(106, 169, 242, 0.35); }
    .ic { flex: none; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: rgba(106, 169, 242, 0.14); color: var(--sky); }
    .ic svg { width: 17px; height: 17px; }
    .txt { min-width: 0; flex: 1; overflow: hidden; }
    .txt b { display: block; font-size: 12px; font-weight: 600; color: #fff; white-space: nowrap; }
    .txt span { display: block; margin-top: 2px; font-size: 10.5px; color: var(--muted-on-dark); white-space: nowrap; }
    .amt { font-size: 12px; font-weight: 600; color: #fff; white-space: nowrap; }
    .chip { display: inline-block; margin-top: 3px; padding: 2px 7px; border-radius: 999px; font-size: 9.5px; font-weight: 600; letter-spacing: 0.02em; }
    .chip-paid { background: rgba(63, 191, 111, 0.16); color: #7fdca2; }
    .chip-qr { background: rgba(106, 169, 242, 0.16); color: #a9cdf7; }
    .right { text-align: right; }
</style>
</head>
<body>
    <div class="bar"></div>

    <div class="copy">
        <div class="head"><span class="logo" role="img" aria-label="Denár">den<span class="logo-a">a<span class="logo-coin" aria-hidden="true"><svg width="40" height="29" viewBox="0 0 44 32"><defs><linearGradient id="f" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9cc8ff"/><stop offset="1" stop-color="#6aa9f2"/></linearGradient><linearGradient id="e" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1e4f92"/><stop offset="0.5" stop-color="#2f6fc4"/><stop offset="1" stop-color="#1e4f92"/></linearGradient></defs><path d="M2 11v6a20 10 0 0 0 40 0v-6a20 10 0 0 1 -40 0z" fill="url(#e)"/><ellipse cx="22" cy="11" rx="20" ry="10" fill="url(#f)"/><ellipse cx="22" cy="11" rx="20" ry="10" fill="none" stroke="#e3efff" stroke-width="0.9" stroke-opacity="0.85"/><ellipse cx="22" cy="11" rx="15.5" ry="7.6" fill="#5c9be8"/><ellipse cx="22" cy="11" rx="15.5" ry="7.6" fill="none" stroke="#e3efff" stroke-width="1.1" stroke-opacity="0.9"/><path d="M8 8.5a15 7 0 0 1 20-5.5" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.9"/></svg></span></span><span>r</span></span><span class="eyebrow">pre WooCommerce</span></div>
        <h1>Doklad ku každej objednávke.</h1>
    </div>

    <!-- Made-up order and numbers - never real customers. -->
    <div class="flow">
        <div class="step">
            <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6 5 3H2"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg></span>
            <span class="txt"><b>Objednávka #1042</b><span>Bankový prevod</span></span>
            <span class="amt">86,10 €</span>
        </div>
        <div class="step">
            <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg></span>
            <span class="txt"><b>Zálohová faktúra</b><span>PF20260042</span></span>
            <span class="right"><span class="chip chip-qr">PAY by square</span></span>
        </div>
        <div class="step">
            <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/><path d="m10 14 2 2 4-4"/></svg></span>
            <span class="txt"><b>Faktúra 20260142</b><span>Spárovaná z banky</span></span>
            <span class="right"><span class="chip chip-paid">Uhradená</span></span>
        </div>
    </div>
</body>
</html>
